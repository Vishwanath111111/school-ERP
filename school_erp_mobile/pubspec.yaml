name: school_erp_mobile
description: Greenwood International School ERP Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core Packages
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking (will be used later)
  dio: ^5.7.0
  shared_preferences: ^2.3.0

  # Utils
  intl: ^0.19.0

  lottie: ^3.1.2
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

